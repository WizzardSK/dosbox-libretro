name: buildbot preflight
on: [push, workflow_dispatch]

env:
  # what the xenial-gcc9 buildbot images actually provide
  GCC9: |
    apt-get update -qy &&
    apt-get install -qy software-properties-common &&
    add-apt-repository -y ppa:ubuntu-toolchain-r/test &&
    apt-get update -qy &&
    apt-get install -qy build-essential g++-9

jobs:
  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker run --rm -e GCC9 -v "$PWD":/src -w /src ubuntu:xenial sh -c '
            eval "$GCC9" &&
            make -f Makefile.libretro CC=gcc-9 CXX=g++-9 -j4 &&
            ls -la dosbox_libretro.so && nm -D --defined-only dosbox_libretro.so | grep " T retro_run"'

  linux-i686:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker run --rm --platform linux/386 -e GCC9 -v "$PWD":/src -w /src i386/ubuntu:xenial sh -c '
            eval "$GCC9" &&
            make -f Makefile.libretro ARCH=x86 CC=gcc-9 CXX=g++-9 -j4 && ls -la dosbox_libretro.so'

  linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker run --rm -e DEBIAN_FRONTEND=noninteractive -v "$PWD":/src -w /src ubuntu:focal sh -c '
            apt-get update -qy && apt-get install -qy build-essential &&
            make -f Makefile.libretro -j4 && ls -la dosbox_libretro.so'

  android-all:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64]
    steps:
      - uses: actions/checkout@v4
      - run: cd jni && $ANDROID_NDK_LATEST_HOME/ndk-build APP_ABI=${{ matrix.abi }} -j4
      - run: find obj -name "libretro.so" -exec file {} \;
